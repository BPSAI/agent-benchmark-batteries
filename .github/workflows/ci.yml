name: governance

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fixture provenance stamp check
        run: python3 governance/check_fixture_stamps.py

      - name: Denylist content scan
        run: python3 governance/check_denylist.py
