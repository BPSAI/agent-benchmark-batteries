name: governance

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fixture provenance stamp check
        run: python3 governance/check_fixture_stamps.py

      - name: Denylist content scan
        run: python3 governance/check_denylist.py

      - name: Results files are the five-column shape
        run: python3 governance/check_results_shape.py

      - name: Governance check tests
        run: python3 -m unittest discover -s governance -p "test_*.py"

      - name: Scorer and runner tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
